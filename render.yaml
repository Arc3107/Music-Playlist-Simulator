services:
  - type: web
    name: music-playlist-simulator
    runtime: static
    staticPublishPath: ./public
    buildCommand: echo "No build needed"
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
